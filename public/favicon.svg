<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Google Blue Gradient Background -->
    <linearGradient id="googleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#1558d6" />
    </linearGradient>
  </defs>

  <!-- Google Blue Squircle Background -->
  <rect width="128" height="128" rx="34" fill="url(#googleBlue)" />

  <!-- Crisp, Bold Single Hiragana 'あ' (Centered) -->
  <text
    x="64"
    y="66"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', 'Meiryo', 'Yu Gothic', sans-serif"
    font-size="86"
    font-weight="900"
    fill="#ffffff"
  >あ</text>
</svg>